; EV offset for cached lighting; safe range is ~[value-12, value+8] EV.
; The project needs BOTH extremes covered: the garage interior meters EV
; -4.1 (live 2026-08-27 clipping warning at the old value 8 = [-4,+16])
; and bright daylight meters EV 15.0 (live 2026-08-28 clipping warning at
; 7 = [-5,+15] - daylight sat exactly on the ceiling). 7.5 covers
; ~[-4.5,+15.5]: ~0.4-0.5 EV of margin at each end. There is no slack to
; move this further either way without re-clipping one of the two scenes.
r.EyeAdaptation.CachedLightingPreExposure=7.5

