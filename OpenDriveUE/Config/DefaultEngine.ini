; §7.15 perf follow-up (2026-09-03, docs/perf_after_art_overhaul.md
; addendum): investigated the pre-existing periodic >=75ms hitch reported
; there. Ruled OUT full GC as the cause via direct LogGarbage=Verbose +
; -odtrace correlation - collect cycles fire on the vanilla ~61s
; gc.TimeBetweenPurgingPendingKillObjects cadence and cost only ~18-20ms
; each, far under the 75ms threshold, and their timestamps never lined up
; with an observed hitch. Also ruled out this project's own tile-streaming
; managers (ODTerrainManager etc.) - the hitches recur even on a fully
; static scene with pending=0/missing=0 on every manager, i.e. zero tile
; churn happening. Two fresh same-day control runs (matching methodology,
; -odrev=20 Frisco) came back completely hitch-free both before and after
; this config change, so the originally-measured hitch is not a
; reproducible fixed-interval engine or game-code mechanism - most likely
; it was transient OS/driver/hardware jitter on the dev machine at capture
; time, not something in engine or game code to fix. These incremental-GC
; settings are kept anyway as free, standard-practice amortization (spreads
; reachability analysis across frames instead of one blocking pass) since
; they cost nothing measurable, not because they were shown to fix this
; specific hitch.
[/Script/Engine.GarbageCollectionSettings]
gc.AllowIncrementalReachability=1
gc.IncrementalReachabilityTimeLimit=0.002
gc.NumRetriesBeforeForcingGC=10
s.ForceGCAfterLevelStreamedOut=0

