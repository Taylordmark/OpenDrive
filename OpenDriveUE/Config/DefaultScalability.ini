; Perf (2026-10-22, gap 8): Epic (@3) overrides to bring a drive from 26-36 ms
; GPU toward the 22 ms target. livetest10 ProfileGPU at 1536x816, all sg 3:
; 31.6 ms, of which VSM Nanite shadow raster 11.4, TSR 3.5, volumetric fog 1.5.
; Lower levels keep the engine's BaseScalability values. Every line is a
; console cvar, so each can be A/B'd live.

[ShadowQuality@3]
; ODDayNightController turns the sun every frame, so the sun is always a
; "moving" light and this bias is the one in force on every drive. Epic's
; -1.5 is 2.8x the engine default resolution (8x the shadow pages, uncached
; every frame). -0.5 is one LOD finer than High's 0: a quarter of Epic's pages.
r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=-0.5
; 8 px cells -> 16 px (High's value) keeps the 128 depth slices that carry
; valley haze: a quarter of the froxels.
r.VolumetricFog.GridPixelSize=16

[AntiAliasingQuality@3]
; 200% history = 3072x1632 history buffers for a 1536x816 screen. 150% keeps
; most of the sharpness on signs and car badges at about half the pixels.
r.TSR.History.ScreenPercentage=150
