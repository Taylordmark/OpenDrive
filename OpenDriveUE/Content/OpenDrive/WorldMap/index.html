<!doctype html>
<!--
  Front-end world map (2026-10-13): Open Drive / Track Select's first screen.
  globe.gl (three.js, MIT, vendored - the same setup as MAAP's GeoGlobe) on
  NASA Blue Marble (public domain; MAAP's darkened copy). AODMainMenu shows it
  in an SWebBrowser over the menu and drives it:
    C++ -> JS  od.init(worldmap.json, opts) once, od.show(opts) on every return
               opts = {title, hint, focus, areas: [{key, name, sub, lat, lng}]}
    JS -> C++  ue.od.webready() on load, ue.od.webpick(key) after the fly-in,
               ue.od.webback() on Esc / right click
  Open it in a browser with ?demo to try it without the game.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Raj; src: url(Rajdhani-SemiBold.ttf); font-weight: 600; }
  @font-face { font-family: Raj; src: url(Rajdhani-Bold.ttf); font-weight: 700; }
  :root { --accent: #ffd889; --text: #f1f4f9; --dim: #bec7d1; --ink: #05070c; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); font-family: Raj, sans-serif;
    user-select: none; cursor: default; }
  #globe { position: absolute; inset: 0; }
  #head { position: absolute; left: 5vw; top: 13vh; pointer-events: none; }
  #title { color: #fff; font-weight: 700; font-size: 4.1vh; letter-spacing: .06em; }
  #bar { width: 5.2vh; height: .37vh; background: var(--accent); margin-top: .4vh; }
  #hint { position: absolute; left: 5vw; bottom: 5vh; color: var(--dim); font-weight: 600; font-size: 1.5vh;
    letter-spacing: .04em; pointer-events: none; }
  #hint b { color: var(--ink); background: var(--text); border-radius: .3vh; padding: .1vh .6vh; margin-right: .5vh; }
  .pin { transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer; white-space: nowrap; }
  .pin i { display: block; width: 1.3vh; height: 1.3vh; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 .35vh rgba(255, 216, 137, .25), 0 0 1.6vh rgba(255, 216, 137, .8); transition: transform .15s; }
  .pin span { position: absolute; left: 2.1vh; top: 50%; transform: translateY(-50%); color: var(--text);
    font-weight: 700; font-size: 1.9vh; letter-spacing: .05em; text-shadow: 0 0 .6vh #000, 0 0 .2vh #000; }
  .pin small { display: block; color: var(--dim); font-weight: 600; font-size: 1.4vh; }
  .pin.on i { transform: scale(1.6); background: #fff; }
  .pin.on span { color: var(--accent); }
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .35s; }
</style>
</head>
<body>
<div id="globe"></div>
<div id="head"><div id="title"></div><div id="bar"></div></div>
<div id="hint"></div>
<div id="fade"></div>
<script src="globe.gl.min.js"></script>
<script>
const OVERVIEW = 1.7, FLY_MS = 1100;
const bridge = () => (window.ue && window.ue.od) || null;
let world, areas = [], focus = 0, busy = false;

function pins() {
  world.htmlElementsData(areas.map((a, i) => ({ ...a, i })));
}

function setFocus(i, fly) {
  if (!areas.length) return;
  focus = (i + areas.length) % areas.length;
  document.querySelectorAll('.pin').forEach(el => el.classList.toggle('on', +el.dataset.i === focus));
  if (fly) world.pointOfView({ lat: areas[focus].lat, lng: areas[focus].lng, altitude: OVERVIEW * 0.7 }, 700);
}

function pick(i) {
  if (busy || !areas[i]) return;
  busy = true;
  setFocus(i, false);
  const a = areas[i];
  world.pointOfView({ lat: a.lat, lng: a.lng, altitude: 0.06 }, FLY_MS);
  setTimeout(() => { document.getElementById('fade').style.opacity = 1; }, FLY_MS - 350);
  setTimeout(() => { bridge() ? bridge().webpick(a.key) : console.log('pick', a.key); }, FLY_MS);
}

function back() {
  if (!busy) bridge() ? bridge().webback() : console.log('back');
}

const od = window.od = {
  init(data, opts) {
    const paths = [];
    const add = (lines, c) => lines.forEach(l => {
      const pts = [];
      for (let k = 0; k < l.length; k += 2) pts.push([l[k + 1], l[k]]);
      paths.push({ pts, c });
    });
    add(data.states, 'rgba(190, 199, 209, 0.22)');
    add(data.borders, 'rgba(190, 199, 209, 0.55)');
    add(data.coast, 'rgba(255, 216, 137, 0.35)');
    world = Globe({ rendererConfig: { antialias: true } })(document.getElementById('globe'))
      .globeImageUrl('globe-dark.jpg').bumpImageUrl('globe-bump.jpg')
      .backgroundColor('rgba(0,0,0,0)').showAtmosphere(true).atmosphereColor('#8894a8').atmosphereAltitude(0.15)
      .pathsData(paths).pathPoints('pts').pathPointLat(p => p[0]).pathPointLng(p => p[1])
      .pathColor('c').pathStroke(null).pathTransitionDuration(0)
      .htmlLat('lat').htmlLng('lng').htmlAltitude(0.002).htmlTransitionDuration(0)
      .htmlElement(d => {
        const el = document.createElement('div');
        el.className = d.i === focus ? 'pin on' : 'pin';
        el.dataset.i = d.i;
        el.innerHTML = `<i></i><span>${d.name}<small>${d.sub || ''}</small></span>`;
        el.onclick = () => pick(d.i);
        el.onmouseenter = () => setFocus(d.i, false);
        return el;
      })
      .htmlElementVisibilityModifier((el, on) => { el.style.display = on ? '' : 'none'; })
      .onGlobeClick(() => {});
    world.controls().minDistance = 101.5;   // globe radius 100
    od.show(opts);
  },
  show(opts) {
    busy = false;
    document.getElementById('fade').style.opacity = 0;
    document.getElementById('title').textContent = opts.title.toUpperCase();
    document.getElementById('hint').innerHTML = opts.hint || '';
    areas = opts.areas;
    const i = focus = Math.max(0, areas.findIndex(a => a.key === opts.focus));
    pins();
    const a = areas[i] || { lat: 38, lng: -105 };
    world.pointOfView({ lat: a.lat, lng: a.lng, altitude: OVERVIEW }, opts.instant ? 0 : 900);
  },
  // keys come from C++ (the game keeps keyboard focus); returns false if unused
  key(k) {
    if (k === 'Escape' || k === 'Backspace') back();
    else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'a' || k === 'w') setFocus(focus - 1, true);
    else if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'd' || k === 's') setFocus(focus + 1, true);
    else if (k === 'Enter' || k === ' ') pick(focus);
    else return false;
    return true;
  },
};

addEventListener('contextmenu', e => { e.preventDefault(); back(); });

if (location.search.includes('demo')) {
  addEventListener('keydown', e => { if (od.key(e.key)) e.preventDefault(); });
  fetch('../Masks/worldmap.json').then(r => r.json()).then(d => od.init(d, {
    title: 'Open Drive', focus: 'summit_county',
    hint: '<b>Click</b> pick &nbsp; <b>Arrows</b> browse &nbsp; <b>Esc</b> back',
    areas: Object.entries(d.areas).map(([key, a]) => ({ key, name: key, sub: a.towns.length + ' towns', lng: a.ll[0], lat: a.ll[1] })),
  }));
} else {
  const ready = () => bridge() ? bridge().webready() : setTimeout(ready, 50);
  ready();
}
</script>
</body>
</html>
